<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline · Buwiz Books</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --fg: #0f172a;
        --muted: #64748b;
        --accent: #2a9d8f;
        --card: #ffffff;
        --border: #e2e8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --fg: #f1f5f9;
          --muted: #94a3b8;
          --accent: #2dd4bf;
          --card: #1e293b;
          --border: rgba(255, 255, 255, 0.08);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: calc(env(safe-area-inset-top) + 1.5rem) 1.5rem
          calc(env(safe-area-inset-bottom) + 1.5rem);
        background: var(--bg);
        color: var(--fg);
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 2rem 1.5rem;
      }
      .icon {
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1rem;
        color: var(--accent);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 650;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.6;
      }
      button {
        min-height: 44px;
        width: 100%;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 0.625rem;
        background: var(--accent);
        color: #fff;
        font-size: 0.9375rem;
        font-weight: 650;
        font-family: inherit;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg
        class="icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M1 1l22 22" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
      <h1>You're offline</h1>
      <!-- Deliberately explicit: in an accounting app, a cached page that looks live is worse
           than no page. Nothing was saved, and nothing is being replayed in the background. -->
      <p>
        Buwiz Books needs a connection to show your books. Any change you were making was not saved
        — reconnect and try it again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
