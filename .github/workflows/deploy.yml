name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-and-hermetic-tests:
    # CI of record runs on the public hexuria mirror. The canonical private
    # repo (codeitlikemiley) has its Actions quota/billing exhausted, so runs
    # there failed at job start on every push and painted main red. Skipping
    # by owner keeps pushes landing everywhere while only hexuria executes;
    # delete these conditions if the private repo's billing is restored.
    if: github.repository_owner == 'hexuria'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Unit tests without a database or provider secrets
        run: bun run test:unit

      - name: Component tests without a database or provider secrets
        run: bun run test:component

  integration-tests:
    if: github.repository_owner == 'hexuria'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buwiz_books
          POSTGRES_PASSWORD: buwiz_books
          POSTGRES_DB: buwiz-books-tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buwiz_books"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://buwiz_books:buwiz_books@localhost:5432/buwiz-books-tests
      TEST_DATABASE_URL: postgresql://buwiz_books:buwiz_books@localhost:5432/buwiz-books-tests
      # The migration entrypoint parses its own target and rejects the "localhost"
      # alias, so this URL states the loopback literal explicitly. It stays separate
      # from DATABASE_URL because a serving credential must never drive migrations.
      MIGRATION_DATABASE_URL: postgresql://buwiz_books:buwiz_books@127.0.0.1:5432/buwiz-books-tests
      # Schema synchronization is fail-closed: this must equal the target database name.
      MIGRATION_SCHEMA_SYNC_CONFIRM: buwiz-books-tests
      BETTER_AUTH_SECRET: ci-test-secret
      RESEND_API_KEY: re_ci_placeholder_key
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # This job builds its database from the Drizzle schema, which is what the
      # integration tests need and what CI has always done. It deliberately does
      # not gate on the managed migration lifecycle: the verifiers describe the
      # shape a migration-built database has, and a pushed one differs -- columns
      # arrive in declaration order rather than the order ALTER statements
      # appended them, and default expressions render as typed literals.
      # Enforcing migration invariants here would mean weakening them until a
      # pushed database passed. The lifecycle gates real databases instead.
      - name: Push schema to test DB
        run: bun x drizzle-kit push --force

      # Applied as plain SQL, deliberately, not through the managed lifecycle.
      #
      # The engine verifies what it applies, and its verifiers describe a
      # migration-built database. This one is built by push, and 0028 cannot be
      # reconciled with that by executing it: organization_group_entities already
      # exists, so 0028's CREATE TABLE IF NOT EXISTS is a no-op and the three
      # constraints it declares inline are never created. Adoption is the only
      # sound outcome there, and teaching every 0028-0036 verifier to accept a
      # pushed shape is its own layer, reserved separately.
      #
      # What this job actually needs is the guards to exist -- the Business Group
      # suites assert the database rejects invalid writes, and an absent trigger
      # rejects nothing.
      #
      # The two compatibility statements are deliberately NARROWER than the
      # adapter's prepare0028/prepare0029, not a copy of them. Those inspect
      # catalog state and refuse on anything ambiguous or partial; these are
      # unconditional IF EXISTS DDL that no-ops on an unexpected shape. That is
      # acceptable only because this database is disposable and rebuilt from
      # scratch every run. Never reuse this block against a real database.
      - name: Apply Enterprise migrations to test DB
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c '
            ALTER TABLE IF EXISTS organization_group_entities
              ADD COLUMN IF NOT EXISTS parent_entity_id uuid;'
          # --single-transaction because 0034 takes a LOCK TABLE, which PostgreSQL
          # refuses outside a transaction block. The runner this replaced wrapped
          # each file in client.begin() for the same reason. None of 0028-0036
          # contains its own BEGIN/COMMIT or a CONCURRENTLY index, so a single
          # enclosing transaction is safe for all of them.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction \
            -f drizzle/0028_enterprise_business_groups.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c '
            ALTER TABLE IF EXISTS organization_group_entities
              DROP CONSTRAINT IF EXISTS organization_group_entities_account_group_fk;
            DROP INDEX IF EXISTS organization_group_entities_account_org_enabled_unique;
            ALTER TABLE IF EXISTS organization_group_entities
              DROP COLUMN IF EXISTS enterprise_account_id;
            ALTER TABLE IF EXISTS organization_groups
              DROP CONSTRAINT IF EXISTS organization_groups_account_id_unique;'
          for file in 0029_business_group_entity_exclusivity \
                      0030_business_group_assignment_probe \
                      0031_flat_business_group_entities \
                      0032_reporting_projections \
                      0033_projection_reconciliation \
                      0034_business_group_admin_guards \
                      0035_enterprise_stripe_billing \
                      0036_enterprise_checkout; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction -f "drizzle/${file}.sql"
          done

      - name: Apply tax foundation to test DB
        run: bun run db:tax:foundation

      - name: Seed tax reference catalog on test DB
        run: bun run db:seed:tax-reference

      - name: Apply RLS policies to test DB
        run: bun run db:rls

      - name: Apply RLS hardening Section A to test DB
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/rls_hardening.sql

      # Read-only, and deliberately not a gate. It reports how far this pushed
      # database is from the managed migration history, which is information worth
      # having in the log; failing the build on it would only invite suppressing
      # the very divergences it exists to surface.
      - name: Report managed migration state (informational)
        continue-on-error: true
        run: bun run db:migrations:verify

      - name: Integration tests
        run: bun run test:integration
