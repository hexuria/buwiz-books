name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-and-hermetic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Unit tests without a database or provider secrets
        run: bun run test:unit

      - name: Component tests without a database or provider secrets
        run: bun run test:component

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buwiz_books
          POSTGRES_PASSWORD: buwiz_books
          POSTGRES_DB: buwiz-books-tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buwiz_books"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://buwiz_books:buwiz_books@localhost:5432/buwiz-books-tests
      TEST_DATABASE_URL: postgresql://buwiz_books:buwiz_books@localhost:5432/buwiz-books-tests
      # The migration entrypoint parses its own target and rejects the "localhost"
      # alias, so this URL states the loopback literal explicitly. It stays separate
      # from DATABASE_URL because a serving credential must never drive migrations.
      MIGRATION_DATABASE_URL: postgresql://buwiz_books:buwiz_books@127.0.0.1:5432/buwiz-books-tests
      # Schema synchronization is fail-closed: this must equal the target database name.
      MIGRATION_SCHEMA_SYNC_CONFIRM: buwiz-books-tests
      BETTER_AUTH_SECRET: ci-test-secret
      RESEND_API_KEY: re_ci_placeholder_key
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One ordered pass owns the whole lifecycle: base schema, pre-schema migrations,
      # schema synchronization, post-schema migrations, finalize. A standalone
      # `drizzle-kit push` here would run the synchronization twice and place it before
      # the pre-schema migrations that exist to keep push non-interactive.
      # This job builds its database from the Drizzle schema, which is what the
      # integration tests need and what CI has always done. It deliberately does
      # not run the managed migration lifecycle: the verifiers describe the shape
      # a migration-built database has, and a pushed one genuinely differs --
      # columns arrive in declaration order rather than ALTER order, and at least
      # one nullability constraint differs between the two. Enforcing migration
      # invariants here would mean weakening them until a pushed database passed.
      # The lifecycle belongs to real databases, owned by the deployment repo.
      - name: Push schema to test DB
        run: bun x drizzle-kit push --force

      # 0028-0036 create guards, functions and triggers that exist in no Drizzle
      # schema file, so push cannot produce them and the Business Group suites
      # fail without them -- they assert that the database *rejects* invalid
      # operations, and an absent guard rejects nothing. The workflow this
      # replaced applied exactly this range. The adapter's 0028/0029
      # compatibility preparation is what lets them land on a pushed schema.
      - name: Apply Enterprise migrations to test DB
        run: bun run db:enterprise:migrate

      - name: Apply RLS policies to test DB
        run: bun run db:rls

      - name: Apply RLS hardening Section A to test DB
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/rls_hardening.sql

      # Read-only, and deliberately not a gate. It reports how far this pushed
      # database is from the managed migration history, which is information worth
      # having in the log; failing the build on it would only invite suppressing
      # the very divergences it exists to surface.
      - name: Report managed migration state (informational)
        continue-on-error: true
        run: bun run db:migrations:verify

      - name: Integration tests
        run: bun run test:integration
